apiVersion: v1
kind: ConfigMap
metadata:
  name: mobilebff-config
  namespace: mobilebff
  labels:
    app: mobilebff
data:
  PORT: "8090"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "mobile_bff_db"
  DB_SSL_MODE: "require"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: mobilebff-secret
  namespace: mobilebff
  labels:
    app: mobilebff
type: Opaque
data:
  # SECURITY WARNING: These values must be replaced with actual secrets in production
  # Use GitHub secrets or external secret management system
  # These are placeholders and MUST be overridden
  DB_USER: "PLACEHOLDER_DB_USER_BASE64"  # postgres
  DB_PASSWORD: "PLACEHOLDER_DB_PASSWORD_BASE64"  # postgres
  JWT_SECRET: "PLACEHOLDER_JWT_SECRET_BASE64"  # your-secret-key
  REDIS_PASSWORD: "PLACEHOLDER_REDIS_PASSWORD_BASE64"